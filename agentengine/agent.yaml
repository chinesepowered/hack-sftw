name: capybarrier
description: Kapi, the CapySpa concierge, protected by Capybarrier, an adaptive immune system that rewrites its own harness. Every request runs the harness version that is currently active in MongoDB Atlas.
entrypoint: capybarrier_agent.main:app
framework: langgraph
language: python

agent_card:
  summary: CapySpa concierge with a self evolving immune system
  capabilities:
    - bookings
    - refunds
    - email
    - prompt-injection-defense
    - self-improving-harness

features:
  guardrails: true

scaling:
  replicas: 4
  agent_idle_ttl_seconds: 600

# LLM calls made through app.llm execute in the tool sandbox, so both sandboxes get the
# model endpoint, Voyage (embeddings for the runbook cache), the Atlas cluster, and Raindrop
# (events and signals out through api.raindrop.ai, flagged production events back through query.raindrop.ai).
sandboxes:
  agent:
    secrets: ["*"]
    tools: []
    network:
      egress_mode: allow_list
      egress:
        - fqdn: api.inference.wandb.ai
          ports: [443]
        - fqdn: ai.mongodb.com
          ports: [443]
        - fqdn: "*.ymi8kv.mongodb.net"
        - fqdn: api.raindrop.ai
          ports: [443]
        - fqdn: query.raindrop.ai
          ports: [443]
  tool:
    secrets: ["*"]
    tools: []
    network:
      egress_mode: allow_list
      egress:
        - fqdn: api.inference.wandb.ai
          ports: [443]
        - fqdn: ai.mongodb.com
          ports: [443]
        - fqdn: "*.ymi8kv.mongodb.net"
        - fqdn: api.raindrop.ai
          ports: [443]
        - fqdn: query.raindrop.ai
          ports: [443]
