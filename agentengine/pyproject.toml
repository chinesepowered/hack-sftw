[project]
name = "capybarrier-agent"
version = "0.1.0"
description = "Kapi the CapySpa concierge on Atlas Agent Engine, guarded by Capybarrier."
requires-python = ">=3.11"
dependencies = [
    "agent-engine-runner-shared[mongodb,tracing]==0.11.8",
    "agent-engine-sdk-langgraph==0.11.8",
    "langchain-openai>=0.3",
    "pymongo[srv]>=4.10",
    "openai>=1.60",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "raindrop-ai>=0.0.75",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capybarrier_agent", "capybarrier"]
