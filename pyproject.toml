[project]
name = "capybarrier"
version = "0.1.0"
description = "An adaptive immune system for AI agents, built on MongoDB Atlas, Voyage AI and Atlas Agent Engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymongo[srv]>=4.10",
    "openai>=1.60",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "streamlit>=1.40",
    "altair>=5.0",
    "pandas>=2.0",
    "raindrop-ai>=0.0.75",
]

[project.scripts]
capybarrier = "capybarrier.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capybarrier"]
